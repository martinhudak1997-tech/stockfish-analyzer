name: Stockfish 19 — analysis

on:
  push:
    paths:
      - requests/position.fen
  workflow_dispatch:
    inputs:
      fen:
        description: "FEN (empty uses requests/position.fen; startpos is supported)"
        required: false
        type: string
      seconds:
        description: "Analysis time in seconds (1-30)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write

concurrency:
  group: stockfish-analysis
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse chess position
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python chess package
        run: python -m pip install --disable-pip-version-check --no-cache-dir python-chess==1.999
      - name: Download official Stockfish 19 for Linux
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stockfish"
          curl --fail --location --retry 3 \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz" \
            --output "$RUNNER_TEMP/stockfish.tar.gz"
          tar -xzf "$RUNNER_TEMP/stockfish.tar.gz" -C "$RUNNER_TEMP/stockfish"
          ENGINE="$(find "$RUNNER_TEMP/stockfish" -type f -name 'stockfish*' ! -name '*.nnue' ! -name '*.md' ! -name '*.txt' | head -n 1)"
          test -n "$ENGINE"
          chmod +x "$ENGINE"
          echo "STOCKFISH_BIN=$ENGINE" >> "$GITHUB_ENV"
          "$ENGINE" --help || true
      - name: Run chess analysis
        env:
          FEN_OVERRIDE: ${{ github.event.inputs.fen || '' }}
          ANALYSIS_SECONDS: ${{ github.event.inputs.seconds || '10' }}
        run: python analyze.py
      - name: Save results for GitHub-connected ChatGPT
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Stockfish analysis [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
